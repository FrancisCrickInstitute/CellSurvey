[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "Spatial-Biology-Pipeline"
platforms = ["win-64", "linux-64", "osx-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "<3.11"

# GPU-accelerated TensorFlow (used by StarDist segmentation) via CUDA. conda-forge only ships
# cudatoolkit/cudnn for Windows and Linux - there's no NVIDIA GPU support on macOS, so StarDist
# falls back to CPU there (still fully functional, just slower; --segmentation-method
# conventional is also available and needs no GPU at all).
[target.win-64.dependencies]
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"

[target.linux-64.dependencies]
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"

[environments]
spatial = ["default"]

[pypi-dependencies]
tensorflow = "<2.11"
stardist = ">=0.9.2, <0.10"
sopa = ">=2.1.11, <3"
muspan = { path = "./latest.zip" }
bioio = ">=3.4.0, <4"
bioio-ome-tiff = ">=1.4.0, <2"
