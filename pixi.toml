[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "Spatial-Biology-Pipeline"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "<3.11"
pixi-pycharm = ">=0.0.12,<0.0.13"
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"

[environments]
spatial = ["default"]

[pypi-dependencies]
tensorflow = "<2.11"
stardist = ">=0.9.2, <0.10"
sopa = ">=2.1.11, <3"
muspan = { path = "./latest.zip" }