[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "CellSurvey"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]

[target.linux-64.dependencies]
python = ">=3.12, <3.13"

[environments]
spatial = ["default"]

[pypi-dependencies]
stardist = ">=0.9.2, <0.10"
sopa = ">=2.1.11, <3"
bioio = ">=3.4.0, <4"
bioio-ome-tiff = ">=1.4.0, <2"
setuptools = ">=72.1.0,<82"
leidenalg = "*"
tf_keras = "*"

[target.linux-64.pypi-dependencies]
tensorflow = { version = ">=2.18", extras = ["and-cuda"] }
