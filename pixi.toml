[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "CellSurvey"
platforms = ["win-64", "linux-64", "osx-64"]
version = "0.1.0"

[tasks]

[dependencies]

[target.win-64.dependencies]
python = "<3.11"
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"

[target.linux-64.dependencies]
python = ">=3.11,<3.12"
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"

[target.osx-64.dependencies]
python = ">=3.11,<3.12"

[environments]
spatial = ["default"]

[pypi-dependencies]
stardist = ">=0.9.2, <0.10"
sopa = ">=2.1.11, <3"
muspan = { path = "./latest.zip" }
bioio = ">=3.4.0, <4"
bioio-ome-tiff = ">=1.4.0, <2"
setuptools = ">=72.1.0,<82"
tensorflow = { version = ">=2.10.1, <3", extras = ["and-cuda"] }

[target.win-64.pypi-dependencies]
tensorflow = "<2.11"

[target.linux-64.pypi-dependencies]
tensorflow = ">=2.11"

[target.osx-64.pypi-dependencies]
tensorflow = ">=2.11"
