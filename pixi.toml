[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "CellSurvey"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]

[dependencies]
pixi-pycharm = ">=0.0.12,<0.0.13"

[target.linux-64.dependencies]
python = ">=3.12, <3.13"

[target.win-64.dependencies]
python = ">=3.12, <3.13"

# Segmenters live in separate environments so TensorFlow (Stardist) and
# PyTorch (InstanSeg) are never co-installed:
#   pixi run python run.py ...                          # Stardist (default)
#   pixi run -e instanseg python run.py --segmenter instanseg ...
[environments]
default = ["stardist", "omero"]
spatial = ["stardist", "omero"]
instanseg = ["instanseg", "omero"]

# Shared by all environments
[pypi-dependencies]
sopa = ">=2.3.0, <3"
bioio = ">=3.4.0, <4"
bioio-ome-tiff = ">=1.4.0, <2"
setuptools = ">=72.1.0,<82"
python-igraph = "*"
scipy = ">=1.14, <2"
networkx = ">=3.4, <4"

# Stardist (TensorFlow) — to be removed once fully migrated to InstanSeg
[feature.stardist.pypi-dependencies]
stardist = ">=0.9.2, <0.10"
tf_keras = "*"

[feature.stardist.target.linux-64.pypi-dependencies]
tensorflow = { version = ">=2.18", extras = ["and-cuda"] }

[feature.stardist.target.win-64.pypi-dependencies]
tensorflow = ">=2.18"

# InstanSeg (PyTorch). PyPI torch wheels bundle CUDA on linux-64; win-64 is CPU-only.
[feature.instanseg.pypi-dependencies]
instanseg-torch = ">=0.1.1"

# OMERO input (omero-py + ZeroC Ice 3.6). From conda-forge: PyPI has no usable
# zeroc-ice wheel for Python 3.12.
[feature.omero.dependencies]
omero-py = "*"
# omero-py brings these in from conda, and pixi locks conda packages before the
# PyPI solve, so they must stay compatible with our PyPI stack:
# - python-dateutil: via omero-py -> matplotlib-base; conda picks 4.x, but every
#   botocore/aiobotocore (s3fs <- fsspec[s3] <- ome-zarr <- spatialdata) needs <3.
python-dateutil = ">=2.8,<3"
# - numpy: omero-py allows >=2,<3 and conda picks the newest (2.5.x), but numba
#   and scipy (via scanpy/sopa) need numpy<2.5.
numpy = ">=2,<2.5"

# Keep s3fs modern. Otherwise a conflict above makes the PyPI resolver backtrack
# to s3fs 0.3.5 (2019 sdist), which fails to build on Python 3.12 and hides the
# real conflict behind a SafeConfigParser error.
[feature.omero.pypi-dependencies]
s3fs = ">=2024.1"
